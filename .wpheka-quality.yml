# WPHEKA Quality configuration for Web Server Information.

project_type: wordpress-plugin

php:
  minimum: "8.1"

wordpress:
  required: true

woocommerce:
  required: false

checks:
  php_syntax: true
  git_diff_check: true
  phpcs: true
  phpstan: true
  phpunit: true
  composer_validate: true
  composer_audit: true
  semgrep: true
  gitleaks: true
  plugin_check: true
  coderabbit: true
  npm: false

# The bundled framework is reviewed in its own repository, against its own
# phpcs.xml. Scanning it here reports the same findings a second time, and the
# ones it reports are inherent rather than fixable: the framework is PSR-4, so
# every file trips WordPress' class-file-naming and lowercase-filename sniffs.
# Its own ruleset excludes those two sniffs; this repository has no ruleset to
# exclude them in, so the directory is excluded instead.
#
# This is not "ignore the framework". A defect in it is a defect in its own
# repository, where the gate that covers it already runs.
exclude:
  - framework/
  - languages/

fail_on: error
